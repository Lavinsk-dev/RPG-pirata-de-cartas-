<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Line Cards - RPG</title>
    <style>
        body {
            background: radial-gradient(circle, #1e1812 0%, #0d0a08 100%);
            color: #f4e4c1;
            font-family: 'Georgia', serif;
            margin: 0;
            padding: 15px;
            text-align: center;
        }
        h1 { color: #d4af37; text-shadow: 2px 2px 4px #000; margin-bottom: 5px; }
        .arena {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin: 15px auto;
            max-width: 900px;
        }
        .ficha {
            background: #2b2118;
            border: 2px solid #8c6d46;
            border-radius: 10px;
            padding: 15px;
            width: 320px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.7);
        }
        .inimigo { border-color: #a83232; background: #2b1616; }
        .barra-status { font-size: 1.1em; font-weight: bold; margin: 8px 0; }
        .pv { color: #ff6b6b; }
        .ep { color: #4dabf7; }
        .log-box {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #d4af37;
            border-radius: 8px;
            padding: 12px;
            max-width: 700px;
            margin: 15px auto;
            font-size: 1.05em;
            color: #ffe066;
        }
        .mao {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-top: 15px;
        }
        .carta {
            background: linear-gradient(180deg, #3d2e1e 0%, #241a10 100%);
            border: 2px solid #d4af37;
            border-radius: 8px;
            width: 175px;
            padding: 10px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-align: left;
        }
        .carta:hover {
            transform: translateY(-8px);
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.4);
        }
        .carta-tipo { font-size: 0.75em; color: #aaa; text-transform: uppercase; }
        .carta-nome { font-weight: bold; color: #ffd43b; font-size: 1em; margin: 4px 0; }
        .carta-custo { color: #4dabf7; font-weight: bold; font-size: 0.85em; }
        .carta-desc { font-size: 0.8em; margin-top: 6px; color: #e9d8b4; }
        .controles-mestre {
            margin-top: 20px;
            padding: 12px;
            background: #1a140f;
            border-top: 1px solid #5c472c;
        }
        button {
            background: #8c6d46;
            color: #fff;
            border: 1px solid #d4af37;
            padding: 8px 14px;
            margin: 4px;
            border-radius: 5px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
        }
        button:hover { background: #a68254; }
        .btn-turno { background: #2b8a3e; border-color: #69db7c; }
        .btn-reset { background: #862e2e; border-color: #ff8787; }
    </style>
</head>
<body>

    <h1>🏴‍☠️ Grand Line Tactics</h1>
    <div class="log-box" id="log">Carregando campo de batalha...</div>

    <div class="arena">
        <div class="ficha" id="ficha-lua"></div>
        <div class="ficha inimigo" id="ficha-inimigo"></div>
    </div>

    <h3>🃏 Mão de Cartas (Toque para jogar)</h3>
    <div class="mao" id="mao-cartas"></div>

    <div class="controles-mestre">
        <div><strong>🎭 Improviso Narrativo (Avaliação do Mestre):</strong></div>
        <button onclick="improviso(0)">Roleplay Básico (+0)</button>
        <button onclick="improviso(2)">Boa Ideia (+2)</button>
        <button onclick="improviso(4)">Cena Épica (+4)</button>
        <br><br>
        <button class="btn-turno" onclick="proximoTurno()">⏭️ Encerrar Turno (Inimigo Age)</button>
        <button class="btn-reset" onclick="reiniciar()">🔄 Reiniciar Batalha</button>
    </div>

    <script>
        async function atualizarTela(dados) {
            if (!dados) {
                const res = await fetch('/api/jogo/estado');
                dados = await res.json();
            }

            document.getElementById('log').innerText = dados.log;

            const lua = dados.lua;
            document.getElementById('ficha-lua').innerHTML = `
                <h2>${lua.nome}</h2>
                <em>"${lua.epiteto}" (${lua.profissao})</em>
                <div class="barra-status pv">❤️ PV: ${lua.pvAtual} / ${lua.pvMax}</div>
                <div class="barra-status ep">⚡ EP: ${lua.epAtual} / ${lua.epMax}</div>
                <div>⚔️ ATK: ${lua.atk} | 🛡️ DEF: ${lua.def} (+${lua.escudoTemporario}) | 💨 VLC: ${lua.vlc}</div>
                <div>⚙️ Armadilhas Setadas: ${lua.armadilhasSetadas.length} | 🎭 Bônus Improviso: +${lua.bonusImproviso}</div>
            `;

            const ini = dados.inimigo;
            document.getElementById('ficha-inimigo').innerHTML = `
                <h2>${ini.nome}</h2>
                <em>"${ini.epiteto}" (${ini.profissao})</em>
                <div class="barra-status pv">❤️ PV: ${ini.pvAtual} / ${ini.pvMax}</div>
                <div>⚔️ ATK: ${ini.atk} | 🛡️ DEF: ${ini.def} | 💨 VLC: ${ini.vlc}</div>
            `;

            const maoDiv = document.getElementById('mao-cartas');
            maoDiv.innerHTML = '';
            lua.mao.forEach((carta, index) => {
                maoDiv.innerHTML += `
                    <div class="carta" onclick="jogarCarta(${index})">
                        <div class="carta-tipo">${carta.tipo}</div>
                        <div class="carta-nome">${carta.nome}</div>
                        <div class="carta-custo">⚡ Custo: ${carta.custoEP} EP</div>
                        <div class="carta-desc">${carta.descricao}</div>
                    </div>
                `;
            });
        }

        async function jogarCarta(indice) {
            const res = await fetch(`/api/jogo/jogar-carta/${indice}`, { method: 'POST' });
            atualizarTela(await res.json());
        }

        async function improviso(bonus) {
            const res = await fetch(`/api/jogo/improviso/${bonus}`, { method: 'POST' });
            atualizarTela(await res.json());
        }

        async function proximoTurno() {
            const res = await fetch('/api/jogo/proximo-turno', { method: 'POST' });
            atualizarTela(await res.json());
        }

        async function reiniciar() {
            const res = await fetch('/api/jogo/reiniciar', { method: 'POST' });
            atualizarTela(await res.json());
        }

        atualizarTela();
    </script>
</body>
</html>
